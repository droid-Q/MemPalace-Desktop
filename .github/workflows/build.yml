name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PRODUCT_NAME: MemPalace
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            arch_name: intel
          - arch: arm64
            arch_name: apple-silicon

    name: Build ${{ matrix.arch_name }}
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          xcodegen generate
          # Downgrade objectVersion for Xcode 15.4 compatibility
          sed -i '' 's/objectVersion = 77/objectVersion = 56/g' MemPalace.xcodeproj/project.pbxproj

      - name: Build ${{ matrix.arch_name }}
        id: build
        run: |
          xcodebuild \
            -project MemPalace.xcodeproj \
            -scheme MemPalace \
            -configuration Release \
            -arch ${{ matrix.arch }} \
            -derivedDataPath ./DerivedData \
            build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Locate .app
        id: locate
        run: |
          APP=$(find ./DerivedData -name "*.app" -type d | head -1)
          echo "path=$APP" >> $GITHUB_OUTPUT
          echo "Found: $APP"

      - name: Package zip (${{ matrix.arch_name }})
        run: |
          mkdir -p output
          APP="${{ steps.locate.outputs.path }}"
          VERSION="${VERSION#v}"
          ZIP_NAME="${{ env.PRODUCT_NAME }}-${{ matrix.arch_name }}-${VERSION}.zip"
          cd "$APP/.."
          zip -r "$GITHUB_WORKSPACE/output/$ZIP_NAME" "$(basename "$APP")"
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Package DMG (${{ matrix.arch_name }})
        run: |
          mkdir -p output
          APP="${{ steps.locate.outputs.path }}"
          VERSION="${VERSION#v}"
          DMG_NAME="${{ env.PRODUCT_NAME }}-${{ matrix.arch_name }}-${VERSION}.dmg"
          hdiutil create -size 200m -volname "${{ env.PRODUCT_NAME }}" -fs HFS+ -srcfolder "$APP" "$GITHUB_WORKSPACE/output/$DMG_NAME"
          echo "dmg_name=$DMG_NAME" >> $GITHUB_OUTPUT

      - name: Upload artifacts (${{ matrix.arch_name }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch_name }}-artifacts
          path: output/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and list release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.zip" -o -name "*.dmg" \) -exec cp {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
